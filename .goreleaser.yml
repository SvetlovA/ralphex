version: 2

builds:
  - id: ralphex
    main: ./cmd/ralphex.windows
    binary: ralphex
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.revision={{.Tag}}
  - id: ralphex-windows
    main: ./cmd/ralphex.windows
    binary: ralphex.windows
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.revision={{.Tag}}

archives:
  - id: ralphex
    ids:
      - ralphex
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    files:
      - completions/*
  - id: ralphex-windows
    ids:
      - ralphex-windows
    name_template: >-
      ralphex_windows_{{ .Version }}_{{ .Arch }}
    formats:
      - zip

nfpms:
  - id: ralphex
    package_name: ralphex
    ids:
      - ralphex
    vendor: svtlv
    homepage: https://github.com/svtlv/ralphex
    maintainer: svtlv
    description: Autonomous plan execution with Claude Code
    license: MIT
    formats:
      - deb
      - rpm
    contents:
      - src: completions/ralphex.bash
        dst: /usr/share/bash-completion/completions/ralphex
      - src: completions/ralphex.zsh
        dst: /usr/share/zsh/vendor-completions/_ralphex
      - src: completions/ralphex.fish
        dst: /usr/share/fish/vendor_completions.d/ralphex.fish

homebrew_casks:
  - name: ralphex.windows
    ids:
      - ralphex
    binaries:
      - ralphex.windows
    homepage: https://github.com/svtlv/ralphex
    description: Autonomous plan execution with Claude Code
    completions:
      bash: completions/ralphex.bash
      zsh: completions/ralphex.zsh
      fish: completions/ralphex.fish
    custom_block: |
      rename "ralphex", "ralphex.windows"
      on_macos do
        postflight_steps do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "ralphex.windows"], chdir: ".", writable_paths: ["ralphex.windows"]
        end
      end
    repository:
      owner: svtlv
      name: ralphex
      branch: homebrew-{{ .Version }}
      pull_request:
        enabled: true
        base:
          owner: svtlv
          name: ralphex
          branch: windows

release:
  prerelease: false
  make_latest: true
  name_template: "{{ .Version }}"
